<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A4エッセイ印刷</title>
  <style>
    @page { size: A4 portrait; margin: 17mm 19mm; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #202020; background: #f1f1ef; }
    main { width: min(100%, 210mm); margin: 20px auto; padding: 17mm 19mm; background: white;
           font: 11.5pt/1.43 Georgia, "Times New Roman", serif; }
    h1 { margin: 0 0 13px; font-size: 32pt; line-height: 1.08; overflow-wrap: anywhere;
         break-after: avoid; }
    form { border: 1px solid #bbb; padding: 14px; margin: 0 0 20px;
           font: 14px/1.5 system-ui, sans-serif; }
    label { display: block; margin-bottom: 5px; }
    textarea { display: block; width: 100%; padding: 8px; font: inherit; }
    textarea { min-height: 9em; resize: vertical; }
    button { margin-top: 10px; padding: 6px 14px; font: inherit;
             color: white; background: #273739; border: 1px solid #273739; }
    button:disabled { opacity: 0.55; }
    article p { margin: 0 0 0.72em; orphans: 2; widows: 2; overflow-wrap: anywhere; }
    @media screen and (max-width: 600px) {
      main { margin: 0 auto; padding: 20px; }
    }
    @media print {
      body { background: white; }
      main { width: auto; margin: 0; padding: 0; }
      form { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <form>
      <label for="essay-input">エッセイ（1行目がタイトル）</label>
      <textarea id="essay-input" placeholder="タイトル&#10;本文"></textarea>
      <button id="print" type="button" disabled>印刷する</button>
    </form>

    <div id="preview" lang="en" hidden>
      <h1 id="essay-title"></h1>
      <article></article>
    </div>
  </main>

  <script>
    const form = document.querySelector('form');
    const essayInput = document.querySelector('#essay-input');
    const printButton = document.querySelector('#print');
    const preview = document.querySelector('#preview');
    const essayTitle = document.querySelector('#essay-title');
    const article = document.querySelector('article');

    function splitFirstLine(text) {
      const firstLineEnd = text.indexOf('\n');
      if (firstLineEnd === -1) return [text, ''];
      return [text.slice(0, firstLineEnd).trim(), text.slice(firstLineEnd + 1).trim()];
    }

    function splitLongParagraph(paragraph) {
      if (paragraph.length < 700) return [paragraph];

      const clauses = paragraph.match(/[^;]*;|[^;]+$/g) ?? [paragraph];
      if (clauses.length < 4) return [paragraph];

      const groups = [];
      let group = '';
      let remainingLength = paragraph.length;
      for (const clause of clauses) {
        group += clause;
        remainingLength -= clause.length;
        if (group.length >= 380 && remainingLength >= 160) {
          groups.push(group.trim());
          group = '';
        }
      }
      if (group.trim()) groups.push(group.trim());
      return groups;
    }

    function render() {
      const [title, text] = splitFirstLine(essayInput.value.trim());
      const paragraphs = text ? text.split(/\n\s*\n/).flatMap(splitLongParagraph) : [];

      essayTitle.textContent = title;
      document.title = title || 'A4エッセイ印刷';
      article.replaceChildren(...paragraphs.map(text => {
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        return paragraph;
      }));

      preview.hidden = !title;
      printButton.disabled = !text;
    }

    essayInput.addEventListener('input', render);
    form.addEventListener('submit', event => event.preventDefault());
    printButton.addEventListener('click', () => window.print());
    render();
  </script>
</body>
</html>
